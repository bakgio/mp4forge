[package]
name = "mp4forge-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mp4forge = { path = "..", features = ["async", "decrypt", "mux"] }
tempfile = "3"
tokio = { version = "1.52.1", features = ["io-util", "rt", "rt-multi-thread"] }

[[bin]]
name = "read_box_structure"
path = "fuzz_targets/read_box_structure.rs"
test = false
doc = false
bench = false

